name: Deploy Chessmes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site and Stockfish 16
        run: |
          set -euo pipefail
          mkdir -p dist/engine
          cp index.html dist/index.html
          npm pack stockfish@16.0.0
          tar -xzf stockfish-16.0.0.tgz
          cp package/src/stockfish-nnue-16-single.js dist/engine/
          cp package/src/stockfish-nnue-16-single.wasm dist/engine/
          cp package/src/nn-5af11540bbfe.nnue dist/engine/
          cp package/Copying.txt dist/engine/STOCKFISH-LICENSE.txt
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
