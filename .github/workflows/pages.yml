name: Deploy Chessmes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site, Stockfish and piece artwork
        run: |
          set -euo pipefail
          mkdir -p dist/engine dist/pieces
          cp index.html dist/index.html
          cp ATTRIBUTIONS.md dist/ATTRIBUTIONS.md

          npm pack stockfish@16.0.0
          tar -xzf stockfish-16.0.0.tgz
          cp package/src/stockfish-nnue-16-single.js dist/engine/
          cp package/src/stockfish-nnue-16-single.wasm dist/engine/
          cp package/src/nn-5af11540bbfe.nnue dist/engine/
          cp package/Copying.txt dist/engine/STOCKFISH-LICENSE.txt

          for piece in wK wQ wR wB wN wP bK bQ bR bB bN bP; do
            curl -fsSL "https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${piece}.svg" -o "dist/pieces/${piece}.svg"
            test -s "dist/pieces/${piece}.svg"
          done

      - name: Validate JavaScript and bundled assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("Inline application script was not found")
          Path("/tmp/chessmes.js").write_text(chr(10).join(scripts))
          for forbidden in ("START_PGN", "Mishalox228337", "Olezhek_y"):
              if forbidden in html:
                  raise SystemExit("Removed sample data is still present: " + forbidden)
          PY
          node --check /tmp/chessmes.js
          test -s dist/pieces/wK.svg
          test -s dist/pieces/bK.svg
          test -s dist/engine/stockfish-nnue-16-single.wasm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
